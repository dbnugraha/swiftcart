# Postgres only. No Redis — this API reads from its own database and has no
# upstream to cache, so a cache would add a failure mode without buying
# anything.
name: swiftcart

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: swiftcart
      POSTGRES_PASSWORD: swiftcart
      POSTGRES_DB: swiftcart
    ports:
      # 5433 on the host so this can run alongside any other local Postgres.
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U swiftcart -d swiftcart"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

volumes:
  pgdata:
